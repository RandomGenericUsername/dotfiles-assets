# Negative fixture: the canonical contract types numeric tokens as unitless
# JSON numbers. A "12px" string is what AGS rejects at startup; this fixture
# must fail validation with "must be a number".
schema_major = 1
name = "glass"

[shape]
radius-panel = "12px"
radius-card = 9
radius-cell = 7
radius-pill = 20
border-w = 1.5

[rhythm]
gap = 8
cell-pad = "8px 9px"

[surface]
bg-panel = "alpha(@surface, 0.94)"
bg-card = "alpha(@surface_container_high, 0.18)"
border = "@primary"
shadow = "none"
blur = "none"

[ink]
ink = "@on_surface"
ink-dim = "alpha(@on_surface, 0.62)"
accent = "@primary"
ink-over = "auto"

[type]
font-family = "inherit"
title-size = 12.5
text-size = 13

[layout]
panel-width = 312
bt-list-spacing = 4
bar-row-height = 0
chip-min = 0
