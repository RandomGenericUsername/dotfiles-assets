power-menu:
  surface: wallpaper
  serves:
    - wallpaper
    - solid
  color_mappings:
    COLOR_BACKGROUND: primary_container
    COLOR_SECONDARY: secondary
    COLOR_ACCENT: primary
    COLOR_FOREGROUND: on_backdrop
  variants:
    - name: power-menu-default
      template: status-bar/power-menu/default/icon.svg
      output: power-menu-default.svg
    - name: power-menu-modern-gradient
      template: status-bar/power-menu/modern/gradient.svg
      output: power-menu-modern-gradient.svg
    - name: power-menu-modern-with-background
      template: status-bar/power-menu/modern/with-background.svg
      output: power-menu-modern-with-background.svg
      # Paints its own disc, so it is not over the wallpaper: solid, and the ink
      # is the matching on-container role.
      surface: solid
      color_mappings:
        COLOR_FOREGROUND: on_primary_container

  bar_mappings:
    widget: power-menu
    icon_size: 24
    states:
      default: power-menu-default

# Power-mode row glyphs for the battery status panel (add-battery-status-panel).
#
# Deliberately NOT a bar group. These glyphs are consumed by the battery
# panel's power-mode list, whose rows sit on the DARK GLASS panel surface
# (alpha(@color_00, 0.94) over a transparent window), never over the
# wallpaper. So the group declares `surface: dark-glass` and pins
# `COLOR_FOREGROUND` to the panel ink (`on_surface`); the glyph reads correctly
# on dark glass. Contrast `battery`, which floats over the wallpaper and pins
# `on_backdrop`.
#
# `balanced` / `powersave` / `performance` are the only variants on purpose —
# the daemon's `Powersave++` and `Performance++` tiers are the SAME mode pushed
# further, not different modes, so `glyphForTier()` resolves their tiers back to
# the base mode's variant rather than inventing a glyph that would
# misrepresent them.
power-mode:
  surface: dark-glass
  color_mappings:
    COLOR_FOREGROUND: on_surface
  variants:
    - name: powersave
      template: power-mode/powersave/default/icon.svg
      output: power-mode-powersave.svg
    - name: balanced
      template: power-mode/balanced/default/icon.svg
      output: power-mode-balanced.svg
    - name: performance
      template: power-mode/performance/default/icon.svg
      output: power-mode-performance.svg

  # The uniform icon contract (AD-7): the panel emits a STATE KEY
  # (`power-mode-powersave`), not a variant. The table maps key -> variant so the
  # mode glyph resolves through the same chain as every other icon. An undeclared
  # tier folds to the `unknown` glyph, whose `power-mode-unknown` key is absent
  # here by design: it blanks rather than crashing (the cell still renders its
  # label). `widget`/`icon_size` are the shared table shape.
  bar_mappings:
    widget: power-mode
    icon_size: 24
    states:
      power-mode-powersave: powersave
      power-mode-balanced: balanced
      power-mode-performance: performance

capture-tool:
  surface: dark-glass
  color_mappings:
    COLOR_FOREGROUND: on_surface
    COLOR_ACCENT: primary
  variants:
    - name: camera
      template: capture-tool/default/camera.svg
      output: capture-tool-camera.svg
    - name: video
      template: capture-tool/default/video.svg
      output: capture-tool-video.svg
    - name: region
      template: capture-tool/default/region.svg
      output: capture-tool-region.svg
    - name: monitor
      template: capture-tool/default/monitor.svg
      output: capture-tool-monitor.svg
    - name: window
      template: capture-tool/default/window.svg
      output: capture-tool-window.svg
    - name: clipboard
      template: capture-tool/default/clipboard.svg
      output: capture-tool-clipboard.svg
    - name: save
      template: capture-tool/default/save.svg
      output: capture-tool-save.svg
    - name: speaker
      template: capture-tool/default/speaker.svg
      output: capture-tool-speaker.svg
    # The mic art is single-sourced from the bar-facing `microphone` group
    # (microphone/default/mic-on.svg); this variant re-exports it under the
    # capture tool's frozen variant name so the capture UI keeps resolving
    # `capture-tool/mic` without its own copy of the artwork.
    - name: mic
      template: microphone/default/mic-on.svg
      output: capture-tool-mic.svg
    - name: info
      template: capture-tool/default/info.svg
      output: capture-tool-info.svg
    - name: warning
      template: capture-tool/default/warning.svg
      output: capture-tool-warning.svg
    - name: pause
      template: capture-tool/default/pause.svg
      output: capture-tool-pause.svg
    - name: play
      template: capture-tool/default/play.svg
      output: capture-tool-play.svg
    - name: stop
      template: capture-tool/default/stop.svg
      output: capture-tool-stop.svg
    # Notification tints: the same glyphs recoloured per outcome so the cards
    # read at a glance (success = primary, the action role of the capture
    # stack; failure = error). A variant pin is reserved for a genuine tint, so
    # these render as tinted copies while the base variants stay on the group's
    # panel ink.
    - name: camera-accent
      template: capture-tool/default/camera.svg
      output: capture-tool-camera-accent.svg
      color_mappings:
        COLOR_FOREGROUND: primary
    - name: video-accent
      template: capture-tool/default/video.svg
      output: capture-tool-video-accent.svg
      color_mappings:
        COLOR_FOREGROUND: primary
    - name: warning-caution
      template: capture-tool/default/warning.svg
      output: capture-tool-warning-caution.svg
      color_mappings:
        COLOR_FOREGROUND: error

