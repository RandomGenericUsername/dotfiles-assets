settings:
  surface: wallpaper
  color_mappings:
    COLOR_FOREGROUND: on_backdrop
  variants:
    - name: default
      template: status-bar/settings/default/icon.svg
      output: status-bar-settings.svg

  bar_mappings:
    widget: settings
    icon_size: 24
    states:
      default: default

# Bluetooth bar indicator. Two states only — `on` and `off` — because that is
# what the glyph art distinguishes: the bare rune, and the rune with a slash.
# "Off" therefore reads as SHAPE, not as dimness, which survives any wallpaper
# and any colour-vision profile.
#
# The glyph floats over the wallpaper, so the surface and the ink are declared
# once at group level (`wallpaper` -> `on_backdrop`). No variant pins the ink:
# a variant pin is a tint, and this indicator has none.
bluetooth:
  surface: wallpaper
  color_mappings:
    COLOR_FOREGROUND: on_backdrop
  variants:
    - name: bluetooth-on
      template: status-bar/bluetooth/on/default/icon.svg
      output: bluetooth-on.svg
    - name: bluetooth-off
      template: status-bar/bluetooth/off/default/icon.svg
      output: bluetooth-off.svg

  bar_mappings:
    widget: bluetooth
    icon_size: 24
    states:
      # NOTE: the keys are deliberately NOT bare `on:` / `off:`. YAML 1.1
      # resolves those to booleans, so `states` would come out of the parser
      # with `True`/`False` keys and every lookup in the bar widget would miss.
      # The other bar groups dodge this the same way (network uses
      # `wifi-not-connected`, not `off`), so this follows house style.
      bluetooth-on: bluetooth-on
      bluetooth-off: bluetooth-off

settings-panel:
  surface: dark-glass
  color_mappings:
    COLOR_FOREGROUND: on_surface
    # Signal ladders: all bars/arcs are always drawn; a level dims the outer
    # ones. The four params default to fully lit and each ladder row overrides
    # the steps its level de-emphasises (outside-in).
    OPACITY_BAR_1: "1"
    OPACITY_BAR_2: "1"
    OPACITY_BAR_3: "1"
    OPACITY_BAR_4: "1"
    OPACITY_ARC_1: "1"
    OPACITY_ARC_2: "1"
    OPACITY_ARC_3: "1"
    OPACITY_ARC_4: "1"
  variants:
    # The settings gear is one drawing: the bar and the panel re-export the
    # same template, so the shape cannot drift between them.
    - name: settings
      template: status-bar/settings/default/icon.svg
      output: settings-panel-settings.svg
    # The capability glyphs bake their own on/off tint through ITR (primary
    # when on, panel ink when off) so the panel renders bare glyphs — no CSS
    # filter, no background box. A variant pin is the on-state tint; the off
    # variant inherits the group ink (on some wallpapers the accent and the
    # neutral are near-identical, so hue cannot carry the state and the panel
    # dims the off glyph via opacity — brightness, not hue, carries "off").
    - name: wifi
      template: settings-panel/wifi/default/icon.svg
      output: settings-panel-wifi.svg
      color_mappings:
        COLOR_FOREGROUND: primary
    - name: wifi-off
      template: settings-panel/wifi/default/icon.svg
      output: settings-panel-wifi-off.svg
    - name: bluetooth
      template: settings-panel/bluetooth/default/icon.svg
      output: settings-panel-bluetooth.svg
      color_mappings:
        COLOR_FOREGROUND: primary
    - name: bluetooth-off
      template: settings-panel/bluetooth/default/icon.svg
      output: settings-panel-bluetooth-off.svg
    # Hyprmod is a stateless action, so it inherits the group ink.
    - name: hyprmod
      template: settings-panel/hyprmod/default/icon.svg
      output: settings-panel-hyprmod.svg
    # Signal-strength glyphs for the Bluetooth row.
    - name: signal-low
      template: settings-panel/signal/default/icon.svg
      output: settings-panel-signal-low.svg
      color_mappings:
        OPACITY_BAR_1: "0.5"
        OPACITY_BAR_2: "0.5"
        OPACITY_BAR_3: "0.5"
    - name: signal-medium
      template: settings-panel/signal/default/icon.svg
      output: settings-panel-signal-medium.svg
      color_mappings:
        OPACITY_BAR_1: "0.5"
        OPACITY_BAR_2: "0.5"
    - name: signal-good
      template: settings-panel/signal/default/icon.svg
      output: settings-panel-signal-good.svg
      color_mappings:
        OPACITY_BAR_1: "0.5"
    - name: signal-high
      template: settings-panel/signal/default/icon.svg
      output: settings-panel-signal-high.svg
    # Bluetooth signal-strength glyphs WITH the circle badge, so the row leads
    # with the same circle-badged mark the Wi-Fi network rows use. The badge
    # takes COLOR_BACKGROUND, the bars take COLOR_FOREGROUND, and the four
    # steps are a progressive opacity ladder (full -> good -> medium -> low,
    # one more bar dimmed per step). All four share one drawing.
    #
    # These REPLACE the bare `signal-*` family above for the row's leading slot:
    # a bare bar glyph next to a circle-badged Wi-Fi row read as two dialects of
    # the same control. The bare `signal-*` variants are kept — they are still
    # resolved by BluetoothContent.tsx today.
    - name: bluetooth-signal-full
      template: settings-panel/bluetooth-signal/default/icon.svg
      output: settings-panel-bluetooth-signal-full.svg
      color_mappings:
        COLOR_BACKGROUND: primary_container
        COLOR_FOREGROUND: on_primary_container
    - name: bluetooth-signal-good
      template: settings-panel/bluetooth-signal/default/icon.svg
      output: settings-panel-bluetooth-signal-good.svg
      color_mappings:
        COLOR_BACKGROUND: surface_container_high
        OPACITY_BAR_1: "0.5"
    - name: bluetooth-signal-medium
      template: settings-panel/bluetooth-signal/default/icon.svg
      output: settings-panel-bluetooth-signal-medium.svg
      color_mappings:
        COLOR_BACKGROUND: surface_container_high
        OPACITY_BAR_1: "0.5"
        OPACITY_BAR_2: "0.5"
    - name: bluetooth-signal-low
      template: settings-panel/bluetooth-signal/default/icon.svg
      output: settings-panel-bluetooth-signal-low.svg
      color_mappings:
        COLOR_BACKGROUND: surface_container_high
        OPACITY_BAR_1: "0.5"
        OPACITY_BAR_2: "0.5"
        OPACITY_BAR_3: "0.5"
    # WiFi signal-strength glyphs with circle badge for network rows.
    - name: wifi-signal-full
      template: settings-panel/wifi-signal/default/icon.svg
      output: settings-panel-wifi-signal-full.svg
      color_mappings:
        COLOR_BACKGROUND: primary_container
        COLOR_FOREGROUND: on_primary_container
    - name: wifi-signal-good
      template: settings-panel/wifi-signal/default/icon.svg
      output: settings-panel-wifi-signal-good.svg
      color_mappings:
        COLOR_BACKGROUND: surface_container_high
        OPACITY_ARC_1: "0.5"
    - name: wifi-signal-medium
      template: settings-panel/wifi-signal/default/icon.svg
      output: settings-panel-wifi-signal-medium.svg
      color_mappings:
        COLOR_BACKGROUND: surface_container_high
        OPACITY_ARC_1: "0.5"
        OPACITY_ARC_2: "0.5"
    - name: wifi-signal-low
      template: settings-panel/wifi-signal/default/icon.svg
      output: settings-panel-wifi-signal-low.svg
      color_mappings:
        COLOR_BACKGROUND: surface_container_high
        OPACITY_ARC_1: "0.5"
        OPACITY_ARC_2: "0.5"
        OPACITY_ARC_3: "0.5"
    # Info glyph re-export for the Wi-Fi weak-security row (system icon).
    # Caution tint follows the warning-caution precedent.
    - name: info-caution
      template: capture-tool/default/info.svg
      output: settings-panel-info-caution.svg
      color_mappings:
        COLOR_FOREGROUND: tertiary
    # Password visibility eye icons for the Wi-Fi prompt (owner-supplied art,
    # group ink — system icons).
    - name: password-show
      template: settings-panel/password-show/default/icon.svg
      output: settings-panel-password-show.svg
    - name: password-hide
      template: settings-panel/password-hide/default/icon.svg
      output: settings-panel-password-hide.svg

brightness:
  surface: wallpaper
  color_mappings:
    COLOR_FOREGROUND: on_backdrop
  variants:
    - name: default
      template: brightness/default/icon.svg
      output: brightness.svg

volume:
  surface: wallpaper
  # One row serves the bar (wallpaper ink) and the volume panel (dark-glass
  # ink); the five `system-*` copies are gone with the surface dimension.
  serves:
    - wallpaper
    - dark-glass
  color_mappings:
    COLOR_FOREGROUND: on_backdrop
    # The outer arc is the volume level: medium dims it, max leaves it lit.
    # muted/lowest/low differ in geometry (the speaker shifts) and keep their
    # own art.
    OPACITY_ARC_1: "1"
  variants:
    - name: muted
      template: volume/muted/default/icon.svg
      output: volume-muted.svg
    - name: lowest
      template: volume/lowest/default/icon.svg
      output: volume-lowest.svg
    - name: low
      template: volume/low/default/icon.svg
      output: volume-low.svg
    - name: medium
      template: volume/default/icon.svg
      output: volume-medium.svg
      color_mappings:
        OPACITY_ARC_1: "0.5"
    - name: max
      template: volume/default/icon.svg
      output: volume-max.svg

  # The uniform icon contract (AD-7): code emits a STATE KEY (`volume-medium`),
  # this table maps key -> variant, and the registry maps variant -> art. The
  # keys are `<group>-<qualifier>` so a key never collides with another group's
  # variant name.
  bar_mappings:
    widget: volume
    icon_size: 24
    states:
      volume-muted: muted
      volume-lowest: lowest
      volume-low: low
      volume-medium: medium
      volume-max: max

# Bar-facing microphone indicator. Kept separate from the capture-tool group
# because the two sit on different surfaces: the bar glyph floats over the
# wallpaper (`on_backdrop`) while capture-tool renders on its own dark panel.
# Two states: `mic-on` (idle/active) and `mic-off` (muted); the shape carries
# the state. One row serves the bar and the dark-glass panel.
microphone:
  surface: wallpaper
  serves:
    - wallpaper
    - dark-glass
  color_mappings:
    COLOR_FOREGROUND: on_backdrop
  variants:
    - name: mic-on
      template: microphone/default/mic-on.svg
      output: microphone-mic-on.svg
    - name: mic-off
      template: microphone/default/mic-off.svg
      output: microphone-mic-off.svg

  # The uniform icon contract (AD-7): the bar emits `microphone-mic-on` /
  # `microphone-mic-off`; this table maps those state keys to the group's two
  # variants.
  bar_mappings:
    widget: microphone
    icon_size: 24
    states:
      microphone-mic-on: mic-on
      microphone-mic-off: mic-off

# Per-application brand icons for the audio popup's stream rows. A LITERAL-COLOR
# exception: the variants ship their own fills (brand marks must stay
# recognisable on any wallpaper), so `color_mappings` is empty and no surface
# ink is applied. Variant names are the PipeWire `application.icon-name` values
# (`google-chrome`, `tidal-hifi`, …); the audio state module falls back to
# `generic` then to the device glyph.
media-controls:
  surface: dark-glass
  color_mappings:
    COLOR_FOREGROUND: on_surface
  variants:
    - name: shuffle
      template: media-controls/shuffle/default/icon.svg
      output: media-controls-shuffle.svg
    - name: shuffle-active
      template: media-controls/shuffle-active/default/icon.svg
      output: media-controls-shuffle-active.svg
      color_mappings:
        COLOR_FOREGROUND: primary
    - name: repeat
      template: media-controls/repeat/default/icon.svg
      output: media-controls-repeat.svg
      color_mappings:
        COLOR_FOREGROUND: primary
    - name: repeat-once
      template: media-controls/repeat-once/default/icon.svg
      output: media-controls-repeat-once.svg
      color_mappings:
        COLOR_FOREGROUND: primary
    - name: repeat-off
      template: media-controls/repeat-off/default/icon.svg
      output: media-controls-repeat-off.svg

app-icons:
  surface: dark-glass
  color_mappings: {}
  variants:
    - name: generic
      template: app-icons/default/generic.svg
      output: app-icon-generic.svg
    - name: google-chrome
      template: app-icons/default/google-chrome.svg
      output: app-icon-google-chrome.svg
    - name: chromium
      template: app-icons/default/chromium.svg
      output: app-icon-chromium.svg
    - name: brave-browser
      template: app-icons/default/brave-browser.svg
      output: app-icon-brave-browser.svg
    - name: firefox
      template: app-icons/default/firefox.svg
      output: app-icon-firefox.svg
    - name: spotify
      template: app-icons/default/spotify.svg
      output: app-icon-spotify.svg
    - name: tidal-hifi
      template: app-icons/default/tidal-hifi.svg
      output: app-icon-tidal-hifi.svg
    - name: whatsapp
      template: app-icons/default/whatsapp.svg
      output: app-icon-whatsapp.svg
    - name: youtube
      template: app-icons/default/youtube.svg
      output: app-icon-youtube.svg
    - name: youtube-music
      template: app-icons/default/youtube-music.svg
      output: app-icon-youtube-music.svg

# Transport-control glyphs for the audio popup's per-app MPRIS rows and the
# Output card's master play/pause button (dispatch contract WP-D). Both
# consumers are rows inside the audio popup, on its dark glass — not the bar —
# so the ink is the panel ink (`on_surface`), and `surface: dark-glass` says so.
media-transport:
  surface: dark-glass
  color_mappings:
    COLOR_FOREGROUND: on_surface
  variants:
    - name: play
      template: media-transport/default/play.svg
      output: media-transport-play.svg
    - name: pause
      template: media-transport/default/pause.svg
      output: media-transport-pause.svg
    - name: previous
      template: media-transport/default/previous.svg
      output: media-transport-previous.svg
    - name: next
      template: media-transport/default/next.svg
      output: media-transport-next.svg

# The audio panel's own play/pause group (finish-audio-panel-redesign). A round
# filled container behind the glyph, used by exactly ONE call site: the main
# transport button in an app row (AudioPopup.tsx). The existing
# `media-transport` group is deliberately untouched, so previous/next, the bar
# and every other surface keep the icons they had -- the separation is by
# construction, not by care. The owner's art carries its own container, so the
# circle is tokenized rather than drawn twice: COLOR_BACKGROUND is the
# GUI-unification primary-action role (`primary`) and COLOR_FOREGROUND is the
# on-action ink the glyph sits on (`on_primary`).
media-transport-panel:
  surface: dark-glass
  color_mappings:
    COLOR_BACKGROUND: primary
    COLOR_FOREGROUND: on_primary
  variants:
    - name: play
      template: media-transport-panel/default/play.svg
      output: media-transport-panel-play.svg
    - name: pause
      template: media-transport-panel/default/pause.svg
      output: media-transport-panel-pause.svg
