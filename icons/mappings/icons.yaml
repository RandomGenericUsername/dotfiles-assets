battery:
  surface: wallpaper
  # One row serves both the bar (wallpaper ink) and the battery panel (dark-glass
  # ink). The surface dimension replaces the five `system-battery-*` rows that
  # existed only to re-render this art with the panel ink.
  serves:
    - wallpaper
    - dark-glass
  color_mappings:
    COLOR_ACCENT: primary
    COLOR_FOREGROUND: on_backdrop
  variants:
    - name: battery-0
      template: status-bar/battery/battery-0/default/icon.svg
      output: battery-0.svg
    - name: battery-25
      template: status-bar/battery/battery-25/default/icon.svg
      output: battery-25.svg
    - name: battery-50
      template: status-bar/battery/battery-50/default/icon.svg
      output: battery-50.svg
    - name: battery-75
      template: status-bar/battery/battery-75/default/icon.svg
      output: battery-75.svg
    - name: battery-100
      template: status-bar/battery/battery-100/default/icon.svg
      output: battery-100.svg
    - name: battery-0-charging
      template: status-bar/battery/battery-0-charging/default/icon.svg
      output: battery-0-charging.svg
    - name: battery-25-charging
      template: status-bar/battery/battery-25-charging/default/icon.svg
      output: battery-25-charging.svg
    - name: battery-50-charging
      template: status-bar/battery/battery-50-charging/default/icon.svg
      output: battery-50-charging.svg
    - name: battery-75-charging
      template: status-bar/battery/battery-75-charging/default/icon.svg
      output: battery-75-charging.svg
    - name: battery-100-charging
      template: status-bar/battery/battery-100-charging/default/icon.svg
      output: battery-100-charging.svg
    - name: plugged
      template: status-bar/battery/plugged/default/icon.svg
      output: plugged.svg
  bar_mappings:
    widget: battery
    icon_size: 24
    states:
      discharging-0: battery-0
      discharging-25: battery-25
      discharging-50: battery-50
      discharging-75: battery-75
      discharging-100: battery-100
      charging-0: battery-0-charging
      charging-25: battery-25-charging
      charging-50: battery-50-charging
      charging-75: battery-75-charging
      charging-100: battery-100-charging
      plugged: plugged

network:
  surface: wallpaper
  # Three declared styles, one state vocabulary. A row is one `state x style`
  # cell; the state table below still resolves a state key to its DEFAULT-style
  # row, so the bar keeps asking for `wifi-full` while a panel may select the
  # bold or rounded drawing of the same state.
  styles:
    - default
    - bold
    - rounded
  color_mappings:
    COLOR_FOREGROUND: on_backdrop
    COLOR_CROSS: error
    COLOR_WARNING: tertiary
    # Level params: every arc is drawn, the level dims the outer ones. Each row
    # overrides only the arcs its level de-emphasises.
    OPACITY_ARC_1: "1"
    OPACITY_ARC_2: "1"
    OPACITY_ARC_3: "1"
    OPACITY_ARC_4: "1"
  variants:
    - name: wifi-full-default
      state: wifi-full
      style: default
      template: status-bar/network/wifi-full/default/icon.svg
      output: wifi-full-default.svg
    - name: wifi-full-bold
      state: wifi-full
      style: bold
      template: status-bar/network/wifi-full/bold/icon.svg
      output: wifi-full-bold.svg
    - name: wifi-full-rounded
      state: wifi-full
      style: rounded
      template: status-bar/network/wifi-full/rounded/icon.svg
      output: wifi-full-rounded.svg
    # high/medium/low default share one canonical drawing (one template, three
    # param sets); `wifi-full` keeps its own art because its path data differs.
    - name: wifi-high-default
      state: wifi-high
      style: default
      template: status-bar/network/wifi/default/icon.svg
      output: wifi-high-default.svg
      color_mappings:
        OPACITY_ARC_1: "0.5"
    - name: wifi-high-bold
      state: wifi-high
      style: bold
      template: status-bar/network/wifi-high/bold/icon.svg
      output: wifi-high-bold.svg
    - name: wifi-high-rounded
      state: wifi-high
      style: rounded
      template: status-bar/network/wifi/rounded/icon.svg
      output: wifi-high-rounded.svg
      color_mappings:
        OPACITY_ARC_1: "0.5"
    - name: wifi-medium-default
      state: wifi-medium
      style: default
      template: status-bar/network/wifi/default/icon.svg
      output: wifi-medium-default.svg
      color_mappings:
        OPACITY_ARC_1: "0.5"
        OPACITY_ARC_2: "0.5"
    - name: wifi-medium-bold
      state: wifi-medium
      style: bold
      template: status-bar/network/wifi-medium/bold/icon.svg
      output: wifi-medium-bold.svg
    - name: wifi-medium-rounded
      state: wifi-medium
      style: rounded
      template: status-bar/network/wifi/rounded/icon.svg
      output: wifi-medium-rounded.svg
      color_mappings:
        OPACITY_ARC_1: "0.5"
        OPACITY_ARC_2: "0.5"
    - name: wifi-low-default
      state: wifi-low
      style: default
      template: status-bar/network/wifi/default/icon.svg
      output: wifi-low-default.svg
      color_mappings:
        OPACITY_ARC_1: "0.5"
        OPACITY_ARC_2: "0.5"
        OPACITY_ARC_3: "0.5"
    - name: wifi-low-bold
      state: wifi-low
      style: bold
      template: status-bar/network/wifi-low/bold/icon.svg
      output: wifi-low-bold.svg
    - name: wifi-low-rounded
      state: wifi-low
      style: rounded
      template: status-bar/network/wifi/rounded/icon.svg
      output: wifi-low-rounded.svg
      color_mappings:
        OPACITY_ARC_1: "0.5"
        OPACITY_ARC_2: "0.5"
        OPACITY_ARC_3: "0.5"
    - name: wifi-not-connected-default
      state: wifi-not-connected
      style: default
      template: status-bar/network/wifi-not-connected/default/icon.svg
      output: wifi-not-connected-default.svg
    - name: wifi-not-connected-bold
      state: wifi-not-connected
      style: bold
      template: status-bar/network/wifi-not-connected/bold/icon.svg
      output: wifi-not-connected-bold.svg
    - name: wifi-not-connected-rounded
      state: wifi-not-connected
      style: rounded
      template: status-bar/network/wifi-not-connected/rounded/icon.svg
      output: wifi-not-connected-rounded.svg
    - name: wifi-no-internet-default
      state: wifi-no-internet
      style: default
      template: status-bar/network/wifi-no-internet/default/icon.svg
      output: wifi-no-internet-default.svg
    - name: wifi-no-internet-bold
      state: wifi-no-internet
      style: bold
      template: status-bar/network/wifi-no-internet/bold/icon.svg
      output: wifi-no-internet-bold.svg
    - name: wifi-no-internet-rounded
      state: wifi-no-internet
      style: rounded
      template: status-bar/network/wifi-no-internet/rounded/icon.svg
      output: wifi-no-internet-rounded.svg
    # bold and rounded are byte-identical for this glyph, so both rows name the
    # one surviving drawing.
    - name: ethernet-connected-default
      state: ethernet-connected
      style: default
      template: status-bar/network/ethernet-connected/default/icon.svg
      output: ethernet-connected-default.svg
    - name: ethernet-connected-bold
      state: ethernet-connected
      style: bold
      template: status-bar/network/ethernet-connected/bold/icon.svg
      output: ethernet-connected-bold.svg
    - name: ethernet-connected-rounded
      state: ethernet-connected
      style: rounded
      template: status-bar/network/ethernet-connected/bold/icon.svg
      output: ethernet-connected-rounded.svg
    - name: ethernet-no-internet-default
      state: ethernet-no-internet
      style: default
      template: status-bar/network/ethernet-no-internet/default/icon.svg
      output: ethernet-no-internet-default.svg
    - name: ethernet-not-connected-default
      state: ethernet-not-connected
      style: default
      template: status-bar/network/ethernet-not-connected/default/icon.svg
      output: ethernet-not-connected-default.svg

  bar_mappings:
    widget: network
    icon_size: 24
    states:
      wifi-full: wifi-full-default
      wifi-high: wifi-high-default
      wifi-medium: wifi-medium-default
      wifi-low: wifi-low-default
      wifi-not-connected: wifi-not-connected-default
      wifi-no-internet: wifi-no-internet-default
      ethernet-connected: ethernet-connected-default
      ethernet-no-internet: ethernet-no-internet-default
      ethernet-not-connected: ethernet-not-connected-default

