# catalog.yaml — what is inside each class of this repository.
#
# This file is REPO-LOCAL TRUTH. It answers "what is in the corpus?" and never
# "where does it deploy?": no consumer destination, no deployment path, no other
# repository's directory name may appear here (spine AD-2/AD-6). The consumer's
# manifest owns the destination map; this file owns the inventory.
#
# `schema_major` is present only for SCHEMA-BEARING classes (breadcrumb: the
# contract file that consumers parse). A class with no contract file carries
# `schema_major: null` — an absent version is a deliberate statement, not a gap.
#
# `contents` states what the class actually holds at this tag. `empty in <tag>`
# is honest for the classes whose corpus arrives in a later slice: nothing here
# describes content this repository does not have.
#
# Parsed by scripts/validate-catalog.py with a deliberately small YAML subset
# (nested mappings, scalar lists, `null`, `[]`). Unsupported YAML is an error,
# never a guess — see that script's docstring.

catalog: 1
repo: dotfiles-assets
tag: v0.19.0

classes:
  icons:
    dir: icons
    subdirs:
      - templates
      - mappings
      - tests
    schema: icons/schema.json
    schema_major: 1
    contents: 123 SVGs in 13 template directories; one group map (icons.yaml) plus the group-independent vocabulary (defaults.yaml); a declared role vocabulary (vocabulary.json, 50 Material roles + on_backdrop), the reviewed role proposal (ROLE-MIGRATION.md) and the icon corpus tests
  templates:
    dir: templates
    subdirs:
      - btop
      - display-manager
      - kitty
      - wlogout
      - zsh
    schema: "templates/**/*.vars.schema.json"
    schema_major: 1
    contents: 9 Jinja sources (zsh .zshrc, wlogout style.css, kitty.conf, btop.conf, 5 display-manager files) each with a sibling vars schema; 22 required variables and 1 optional (the SDDM Wayland greeter compositor command, defaulted in the body to weston --shell=kiosk); no rendered output
  configs:
    dir: configs
    subdirs:
      - hypr
      - hyprpaper
      - nvim
      - rofi
      - starship
      - wlogout
    schema: null
    schema_major: null
    contents: 25 static files; Hyprland (13 Lua), hyprpaper.conf, rofi config.rasi, Neovim (8), starship.toml and the wlogout layout; no Jinja source, no rendered output, no mutable state
  content:
    dir: content
    subdirs:
      - wallpapers
      - btop-themes
    schema: null
    schema_major: null
    contents: wallpapers.tar.gz (unmodified blob, top-level default.png) and authored btop themes (none yet)
  desktop:
    dir: desktop
    subdirs:
      - applications
      - scripts
    schema: desktop/desktop.yaml
    schema_major: 1
    contents: 6 per-user application entries (3 Wayland-native IDE overrides + TIDAL's /dev/shm workaround + 2 kitty-hosted AI CLIs) and the toggle-touchpad helper; every entry declares requires/optional and carries TryExec
  skins:
    dir: skins
    subdirs:
      - contracts
      - manifests
      - templates
      - tests
    schema: skins/schema.json
    schema_major: 2
    contents: "5 Appearance v2 TOML manifests (glass default/fallback parity with today's ags-bar look, flat, paper with explicit mode.light overrides, terminal dense-monospace square/hairline, terminal-host the same terminal tokens with the opt-in [host] policy) using six required surface roles surface.{window,panel,card,cell,control,pill} (window carries bg/border/border-width/radius/padding/shadow/blur plus the unitless [0,1] opacity and is never aliased from panel), state.{hover,selected,focus,disabled}, type, ink and namespaced layout.<app> numeric metrics; twelve shared templates in two fail-closed families: eight app-owned CSS targets named <configDir>.gtk.css.j2 (ags settings/Bluetooth plus ags-clipboard, ags-notifications, ags-wallpaper-selector, ags-capture, ags-icme, ags-btop-studio and wlogout outer window (surface.window.bg) and action cards (surface.card fill/border/padding with surface.panel radius/border-width for host alignment; hover/focus retain the card fill and move only state ring/ink, active keeps selected fill/ink/ring; the static wlogout source keeps only app-owned structure because the generated sheet imported last owns its paint/rhythm/typography), two global CSS targets gtk3/gtk4 with conservative selector allowlists and no layout/size properties (GTK3 forbids custom properties/colour-mixing; GTK4 publishes libadwaita named colours), and two non-CSS artifacts: rofi.rasi.j2 (consumer rofi, format rasi: solid hyphenated palette roles plus px geometry only, no alpha, no underscore role name, typography deferred) and kitty.conf.j2 (consumer kitty, format conf: paint-free first-usable font_family, font_size/window_padding_width as bare points via the documented 0.75 px->pt two-decimal round-half-up with clamps, and background_opacity; colours stay colors.kitty, and theme stays reserved so btop remains palette-only); the expander renders <configDir>.css and <consumer>.<format>, and unknown suffixes fail closed; the frozen required_targets (including gtk3/gtk4) and required_artifacts (rofi/rasi, kitty/conf) sets are matched exactly so a missing consumer template fails the gate; layout tokens are TSX-owned and never emitted in any format; the CSS-min-derived ags-capture and ags-btop-studio blocks were removed in v0.13.0; the vendored canonical contracts v0.12.0 appearance manifest/json/artifact schemas pinned by sha256 (the required-window release; the generation manifest schema records the same seven delegated paths for byte parity) plus the frozen v1 skin schemas for provenance; the optional root [host] policy on glass, paper and terminal-host (window and panel radius/border width plus card/control/cell radii, mode override > host > skin fallback, with window padding/opacity and the pill radius deliberately explicit; terminal and flat explicitly opt out, so the original terminal stays [host]-free) as a policy object rather than a token group; the validator resolves host probe values into the seven inherited window/panel/rectangle paths only; the local schema envelope delegating to the appearance schemas and naming tokens.json; and the pytest fixture set including template-name, glass-vs-source tokenized parity, terminal positive/negative shape, paper light/dark mode expansion, state/role coverage, per-app expansion/selector checks, GTK3/GTK4 parse probes, rofi -dump-theme+stderr probes, required-target/artifact negatives, format-dialect negatives (GTK3 var/color-mix, GTK4 selector/layout, rasi alpha/underscore/hex), host permit/deny fixtures (all-seven rectangle paths accepted; window padding/opacity and pill radius rejected), required-window fixtures (missing group/token and opacity bounds) and kitty projection fixtures (first-family rule, 0.75 px->pt points and clamps, kitty +runpy parse), terminal-host = terminal + [host] fixtures, host-resolution fixtures and negative numeric-string/mode/layout fixtures; no structure/variant tokens, no literal hex, no transitions"
