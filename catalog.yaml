# catalog.yaml — what is inside each class of this repository.
#
# This file is REPO-LOCAL TRUTH. It answers "what is in the corpus?" and never
# "where does it deploy?": no consumer destination, no deployment path, no other
# repository's directory name may appear here (spine AD-2/AD-6). The consumer's
# manifest owns the destination map; this file owns the inventory.
#
# `schema_major` is present only for SCHEMA-BEARING classes (breadcrumb: the
# contract file that consumers parse). A class with no contract file carries
# `schema_major: null` — an absent version is a deliberate statement, not a gap.
#
# `contents` states what the class actually holds at this tag. `empty in <tag>`
# is honest for the classes whose corpus arrives in a later slice: nothing here
# describes content this repository does not have.
#
# Parsed by scripts/validate-catalog.py with a deliberately small YAML subset
# (nested mappings, scalar lists, `null`, `[]`). Unsupported YAML is an error,
# never a guess — see that script's docstring.

catalog: 1
repo: dotfiles-assets
tag: v0.3.1

classes:
  icons:
    dir: icons
    subdirs:
      - templates
      - mappings
    schema: icons/schema.json
    schema_major: 1
    contents: 117 SVGs in 12 template directories; one group map (icons.yaml) plus the group-independent vocabulary (defaults.yaml)
  templates:
    dir: templates
    subdirs: []
    schema: templates/example.vars.schema.json
    schema_major: 1
    contents: empty in v0.3.0 (the shape contract only)
  configs:
    dir: configs
    subdirs:
      - hypr
      - hyprpaper
      - nvim
      - rofi
      - starship
      - wlogout
    schema: null
    schema_major: null
    contents: 25 static files; Hyprland (13 Lua), hyprpaper.conf, rofi config.rasi, Neovim (8), starship.toml and the wlogout layout; no Jinja source, no rendered output, no mutable state
  content:
    dir: content
    subdirs:
      - wallpapers
      - btop-themes
    schema: null
    schema_major: null
    contents: wallpapers.tar.gz (unmodified blob, top-level default.png) and authored btop themes (none yet)
  desktop:
    dir: desktop
    subdirs:
      - applications
      - scripts
    schema: null
    schema_major: null
    contents: empty in v0.3.0
